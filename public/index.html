<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3516">
<title>Color Breaker</title>
<style>
  :root {
    --wood-1: #b97a43; --wood-2: #a96a36; --wood-dark: #5a3516; --wood-deep: #3b200c;
    --carve: #7e4a22; --gold: #ffe27a;
    --d: min(46px, calc((min(100vw, 460px) - 150px) / var(--n, 4) - 8px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #1c1108; }
  body {
    min-height: 100vh; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #fff4d6;
    display: flex; justify-content: center;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  .hidden { display: none !important; }

  /* the wooden board */
  .screen {
    width: 100%; max-width: 480px; min-height: 100vh; padding: 14px 12px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.05) 0 2px, rgba(255,255,255,.04) 2px 5px, transparent 5px 11px),
      linear-gradient(180deg, var(--wood-1), var(--wood-2) 55%, #9c5f2e);
    box-shadow: inset 0 0 0 3px #7a4a24, inset 0 0 40px rgba(0,0,0,.35);
  }

  .plaque {
    font-weight: 800; letter-spacing: 3px; text-transform: uppercase; text-align: center;
    color: #8a5428; text-shadow: 0 1px 0 rgba(255,220,170,.55), 0 -1px 1px rgba(0,0,0,.45);
    background: linear-gradient(#a86a37, #94592c); border-radius: 10px; padding: 8px 14px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5), 0 1px 0 rgba(255,220,170,.4);
  }

  /* green wooden buttons */
  .wbtn {
    border: 0; border-radius: 12px; padding: 14px 20px; min-width: 150px; font-weight: 800; font-size: 1.25rem;
    letter-spacing: 1px; text-transform: uppercase; color: #ffee8a; text-shadow: 0 2px 2px rgba(0,0,0,.45);
    background: linear-gradient(#6fb02b, #4a8a1c);
    box-shadow: 0 0 0 4px #8a5428, 0 0 0 6px #5a3516, 0 5px 0 6px #3b200c, inset 0 2px 0 rgba(255,255,255,.35);
    margin-bottom: 8px;
  }
  .wbtn:active { transform: translateY(3px); }
  .wbtn:disabled { filter: grayscale(.8) brightness(.8); cursor: not-allowed; }
  .wbtn.small { font-size: 1rem; min-width: 0; padding: 10px 16px; }
  .wbtn.brown { background: linear-gradient(#b27a45, #8f5a2b); color: #ffe9c4; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* menu */
  #menu { justify-content: center; gap: 22px; }
  #menu h1 { margin: 0; font-size: 2.1rem; }
  .bulb { font-size: 2.2rem; filter: drop-shadow(0 0 10px #ffe27a); }
  .titlerow { display: flex; align-items: center; gap: 10px; }
  .best { font-size: .95rem; color: #ffe9c4; text-shadow: 0 1px 2px #000; min-height: 1.2em; text-align: center; }
  .menu-help { max-width: 320px; font-size: .9rem; text-align: center; line-height: 1.45; text-shadow: 0 1px 2px #000; }

  /* game header */
  .top { width: 100%; display: flex; align-items: center; gap: 10px; }
  .scorebox { min-width: 74px; text-align: center; font-weight: 800; font-size: 1.3rem; padding: 4px 8px; }
  .scorebox small { display: block; font-size: .65rem; letter-spacing: 2px; opacity: .8; }
  .top .plaque { flex: 1; font-size: 1.15rem; }
  .menubtn { width: 46px; height: 46px; border-radius: 10px; border: 0; font-weight: 900; font-size: 1.1rem;
    background: linear-gradient(#a86a37, #94592c); box-shadow: inset 0 2px 5px rgba(0,0,0,.5); color: #8a5428; text-shadow: 0 1px 0 rgba(255,220,170,.55); }

  /* rows */
  .rows { display: flex; flex-direction: column; gap: 7px; width: 100%; align-items: center; }
  .row { display: flex; align-items: center; gap: 8px; }
  .num { width: 22px; text-align: right; font-weight: 800; font-size: 1.4rem; color: #8a5428; text-shadow: 0 1px 0 rgba(255,220,170,.5); }
  .row.active .num { color: #ffe9a8; }
  .hintbox {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; width: 46px; padding: 6px; border-radius: 8px;
    background: #94592c; box-shadow: inset 0 2px 5px rgba(0,0,0,.55), 0 1px 0 rgba(255,220,170,.35);
  }
  .hp { width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(#2b1608, #55300f); box-shadow: inset 0 1px 2px #000; }
  .hp.black { background: radial-gradient(circle at 35% 30%, #777 0 10%, #111 45%, #000); box-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .hp.white { background: radial-gradient(circle at 35% 30%, #fff 0 10%, #ddd 45%, #8a8a8a); box-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .strip {
    display: flex; gap: 8px; padding: 6px 10px; border-radius: 999px;
    background: linear-gradient(#a2642f, #9a5e2c); box-shadow: inset 0 2px 6px rgba(0,0,0,.45), 0 1px 0 rgba(255,220,170,.4);
  }
  .row.active .strip { box-shadow: inset 0 2px 6px rgba(0,0,0,.45), 0 0 0 3px #ffe27a; }
  .hole {
    position: relative; width: var(--d); height: var(--d); border-radius: 50%; padding: 0; border: 0; display: block;
    background: radial-gradient(circle at 50% 40%, #1f1006 0 38%, #5a3516 40% 62%, #8a5428 64%);
    box-shadow: inset 0 3px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,220,170,.4);
  }
  .hole.sel::before, .hole.sel::after { content: ""; position: absolute; left: 50%; margin-left: -5px; border: 5px solid transparent; }
  .hole.sel::before { top: -13px; border-top: 7px solid #fff; border-bottom: 0; }
  .hole.sel::after { bottom: -13px; border-bottom: 7px solid #fff; border-top: 0; }

  /* marbles */
  .marble {
    width: 100%; height: 100%; border-radius: 50%; display: block;
    background: radial-gradient(circle at 34% 28%, #fff 0 7%, var(--c) 36%, var(--c2) 100%);
    box-shadow: 0 3px 4px rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.25);
  }
  .hole .marble { position: absolute; inset: 0; }
  .covered {
    width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #6e3f1b;
    background: linear-gradient(#b9814d, #96602f); box-shadow: inset 0 2px 4px rgba(0,0,0,.45);
  }
  .secretrow .strip { background: linear-gradient(#7f4a22, #6a3c19); }
  .secretrow .hole { background: transparent; box-shadow: none; }
  .secretrow .num { font-size: 1.2rem; }
  @media (prefers-reduced-motion: no-preference) {
    .pop { animation: pop .35s ease-out; }
    @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  }

  /* palette */
  .tray { display: flex; gap: 10px; padding: 10px 14px; margin-top: 4px; border-radius: 999px; background: linear-gradient(#8e5528, #7d4a22);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,220,170,.4); }
  .tray button { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 0; background: none; }
  .tray button:active { transform: scale(.88); }
  .actions { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .bulbbtn { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.1rem; background: linear-gradient(#a86a37, #94592c);
    border: 0; border-radius: 12px; padding: 8px 12px; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); }
  .bulbbtn:disabled { opacity: .5; }
  #msg { min-height: 2.8em; text-align: center; font-weight: 700; max-width: 360px; text-shadow: 0 1px 3px #000; line-height: 1.35; }
</style>
</head>
<body>

<!-- Start screen -->
<main class="screen" id="menu">
  <div class="titlerow"><span class="bulb">💡</span><h1 class="plaque">Color Breaker</h1><span class="bulb">💡</span></div>
  <div>
    <button class="wbtn" data-mode="easy">Easy</button><br>
    <button class="wbtn" data-mode="hard">Hard</button>
  </div>
  <div class="best" id="best"></div>
  <p class="menu-help">Crack the secret color code! After each guess, a <b>black</b> peg means a right color in the right hole. A <b>white</b> peg means a right color in the wrong hole.</p>
</main>

<!-- Game screen -->
<main class="screen hidden" id="game">
  <div class="top">
    <div class="plaque scorebox"><small>SCORE</small><span id="score">0</span></div>
    <div class="plaque" id="modeName">Easy</div>
    <button class="menubtn" id="menuBtn" aria-label="Back to menu">II</button>
  </div>
  <div class="rows" id="rows"></div>
  <div class="tray" id="tray" role="group" aria-label="Colors"></div>
  <div class="actions">
    <button class="bulbbtn" id="bulb" aria-label="Use a hint"><span>💡</span> x<span id="bulbs">2</span></button>
    <button class="wbtn small" id="check">Check</button>
  </div>
  <div id="msg" role="status"></div>
</main>

<script>
const COLORS = [
  { name: "white",  c: "#f4f4f4", c2: "#a8a8a8" },
  { name: "pink",   c: "#e754d0", c2: "#8e1c7c" },
  { name: "yellow", c: "#f7dc1a", c2: "#a98a00" },
  { name: "green",  c: "#3bc14f", c2: "#17702a" },
  { name: "red",    c: "#e23a2e", c2: "#8a1010" },
  { name: "blue",   c: "#2f6fe8", c2: "#123a95" },
];
const MODES = {
  easy: { label: "Easy", pegs: 4, repeats: false, tries: 8,  bulbs: 2 },
  hard: { label: "Hard", pegs: 5, repeats: true,  tries: 10, bulbs: 2 },
};

// exact = right color + right hole, partial = right color + wrong hole
function score(secret, guess) {
  let exact = 0; const s = [], g = [];
  secret.forEach((c, i) => { if (c === guess[i]) exact++; else { s.push(c); g.push(guess[i]); } });
  let partial = 0;
  g.forEach(c => { const k = s.indexOf(c); if (k >= 0) { partial++; s.splice(k, 1); } });
  return { exact, partial };
}
function makeSecret(m) {
  const pool = [...Array(COLORS.length).keys()], out = [];
  while (out.length < m.pegs) {
    const i = Math.floor(Math.random() * pool.length);
    out.push(pool[i]);
    if (!m.repeats) pool.splice(i, 1);
  }
  return out;
}

if (typeof document === "undefined") { module.exports = { score, makeSecret, MODES, COLORS }; }
else {
  const $ = id => document.getElementById(id);
  let modeKey, m, secret, guesses, current, sel, over, revealed, bulbs, total = 0;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const marble = (ci, extra = "") => `<span class="marble ${extra}" style="--c:${COLORS[ci].c};--c2:${COLORS[ci].c2}"></span>`;

  function showMenu() {
    $("game").classList.add("hidden"); $("menu").classList.remove("hidden");
    const e = store.get("cb-best-easy"), h = store.get("cb-best-hard");
    $("best").textContent = (e || h) ? `Best scores: Easy ${e || 0} · Hard ${h || 0}` : "";
  }

  function start(key) {
    if (key !== modeKey) total = 0;
    modeKey = key; m = MODES[key];
    secret = makeSecret(m); guesses = []; current = Array(m.pegs).fill(undefined); sel = 0;
    over = false; revealed = new Set(); bulbs = m.bulbs;
    document.documentElement.style.setProperty("--n", m.pegs);
    $("menu").classList.add("hidden"); $("game").classList.remove("hidden");
    $("modeName").textContent = m.label;
    $("tray").innerHTML = COLORS.map((c, i) =>
      `<button data-c="${i}" aria-label="${c.name}">${marble(i)}</button>`).join("");
    $("tray").querySelectorAll("button").forEach(b => b.onclick = () => addColor(+b.dataset.c));
    say(`Pick ${m.pegs} colors, then press Check!`);
    render();
  }

  function say(t) { $("msg").textContent = t; }
  function filled() { return current.filter(x => x !== undefined).length; }

  function hintBox(r) {
    let cells = "";
    if (r) {
      const { exact, partial } = score(secret, r);
      for (let i = 0; i < m.pegs; i++) cells += `<span class="hp ${i < exact ? "black" : i < exact + partial ? "white" : ""}"></span>`;
    } else for (let i = 0; i < m.pegs; i++) cells += `<span class="hp"></span>`;
    return `<div class="hintbox">${cells}</div>`;
  }

  function render() {
    let html = `<div class="row secretrow"><span class="num">🔒</span><div class="hintbox" style="visibility:hidden"></div><div class="strip">`;
    for (let p = 0; p < m.pegs; p++) {
      const show = over || revealed.has(p);
      html += `<div class="hole">${show ? marble(secret[p], "pop") : `<span class="covered">?</span>`}</div>`;
    }
    html += `</div></div>`;
    for (let r = m.tries - 1; r >= 0; r--) {
      const done = r < guesses.length, active = r === guesses.length && !over;
      html += `<div class="row ${active ? "active" : ""}"><span class="num">${r + 1}</span>${hintBox(done ? guesses[r] : null)}<div class="strip">`;
      for (let p = 0; p < m.pegs; p++) {
        const ci = done ? guesses[r][p] : active ? current[p] : undefined;
        const inner = ci === undefined ? "" : marble(ci);
        if (active) html += `<button class="hole ${p === sel ? "sel" : ""}" data-p="${p}" aria-label="${ci === undefined ? "empty hole" : COLORS[ci].name + ", tap to remove"}">${inner}</button>`;
        else html += `<div class="hole">${inner}</div>`;
      }
      html += `</div></div>`;
    }
    $("rows").innerHTML = html;
    $("rows").querySelectorAll("button.hole").forEach(b => b.onclick = () => {
      const p = +b.dataset.p; current[p] = undefined; sel = p; render();
    });
    $("score").textContent = total;
    $("bulbs").textContent = bulbs;
    $("bulb").disabled = over || bulbs <= 0 || revealed.size >= m.pegs - 1;
    $("check").textContent = over ? "Play again" : "Check";
    $("check").disabled = !over && filled() < m.pegs;
  }

  function addColor(ci) {
    if (over) return;
    current[sel] = ci;
    let n = current.findIndex((x, i) => i > sel && x === undefined);
    if (n < 0) n = current.findIndex(x => x === undefined);
    if (n >= 0) sel = n;
    render();
  }

  function check() {
    if (over) { start(modeKey); return; }
    if (filled() < m.pegs) return;
    const g = current.slice(); guesses.push(g);
    current = Array(m.pegs).fill(undefined); sel = 0;
    const r = score(secret, g);
    if (r.exact === m.pegs) {
      over = true;
      const pts = (m.tries - guesses.length + 1) * 10 - (m.bulbs - bulbs) * 5;
      total += Math.max(pts, 5);
      const key = "cb-best-" + modeKey;
      if (total > (+store.get(key) || 0)) store.set(key, total);
      render();
      say(`🎉 You cracked it in ${guesses.length} ${guesses.length === 1 ? "try" : "tries"}! +${Math.max(pts, 5)} points`);
    } else if (guesses.length >= m.tries) {
      over = true; render();
      say("😮 Out of tries! The secret code is shown at the top. Try again!");
    } else {
      render();
      say(`${r.exact} black, ${r.partial} white. Keep going!`);
    }
  }

  function useBulb() {
    if (over || bulbs <= 0) return;
    const options = [...Array(m.pegs).keys()].filter(p => !revealed.has(p));
    if (options.length <= 1) return;
    const p = options[Math.floor(Math.random() * options.length)];
    revealed.add(p); bulbs--;
    render();
    say(`💡 Hole ${p + 1} is ${COLORS[secret[p]].name}!`);
  }

  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
  $("check").onclick = check;
  $("bulb").onclick = useBulb;
  $("menuBtn").onclick = showMenu;
  showMenu();
}
</script>
</body>
</html>
