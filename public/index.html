<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1b1b1f; --muted:#6b7280; --border:#e5e7eb; --panel:#f9fafb; --link:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e7e7ea; --muted:#9aa0aa; --border:#2a2b32; --panel:#1b1c22; --link:#7db4ff; } }
  * { box-sizing: border-box; }
  html, body { touch-action: manipulation; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:420px; padding:32px 24px; text-align:center; }
  h1 { font-size:26px; margin:0 0 8px; }
  .tagline { color:var(--muted); margin:0 0 28px; }
  .game { display:flex; align-items:center; gap:14px; text-align:left; text-decoration:none; color:inherit;
    border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:16px 20px; margin-bottom:14px; }
  .game:hover { border-color:var(--link); }
  .game:focus-visible { outline:3px solid var(--link); outline-offset:2px; }
  .game svg { flex:none; }
  .game b { display:block; font-size:17px; }
  .game span { color:var(--muted); font-size:14px; }
  .game i { margin-left:auto; font-style:normal; color:var(--link); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="tagline">Pick a game to play.</p>
  <a class="game" href="colorbreaker/index.html">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <div><b>Color Breaker</b><span>Crack the secret color code.</span></div><i>&rarr;</i>
  </a>
  <a class="game" href="numbercross/index.html">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
    <div><b>Number Cross</b><span>Fill in the missing numbers.</span></div><i>&rarr;</i>
  </a>
</main>
</body>
</html>
