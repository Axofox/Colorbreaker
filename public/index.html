<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1b1b1f; --muted:#6b7280; --border:#e5e7eb; --panel:#f9fafb; --link:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e7e7ea; --muted:#9aa0aa; --border:#2a2b32; --panel:#1b1c22; --link:#7db4ff; } }
  * { box-sizing: border-box; }
  html, body { touch-action: manipulation; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:420px; padding:24px 16px; text-align:center; }
  h1 { font-size:26px; margin:0 0 8px; }
  .tagline { color:var(--muted); margin:0 0 20px; }
  .game { display:flex; align-items:center; gap:14px; text-align:left; text-decoration:none; color:inherit;
    border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:12px 16px; margin-bottom:10px; }
  .game:hover { border-color:var(--link); }
  .game:focus-visible { outline:3px solid var(--link); outline-offset:2px; }
  .game svg { flex:none; }
  .game b { display:block; font-size:17px; }
  .game span { color:var(--muted); font-size:14px; }
  .game i { margin-left:auto; font-style:normal; color:var(--link); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="tagline">Pick a game to play.</p>
  <a class="game" href="colorbreaker/index.html">
    <svg class="logo" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="8" fill="#1f2937"/>
    <circle cx="10.5" cy="10.5" r="5" fill="#e23a2e"/><circle cx="21.5" cy="10.5" r="5" fill="#f7dc1a"/>
    <circle cx="10.5" cy="21.5" r="5" fill="#3bc14f"/><circle cx="21.5" cy="21.5" r="5" fill="#2f6fe8"/>
  </svg>
    <div><b>Color Breaker</b><span>Crack the secret color code.</span></div><i>&rarr;</i>
  </a>
  <a class="game" href="numbercross/index.html">
    <svg class="logo" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="11.5" y="1" width="9" height="9" rx="2.5" fill="#2f6fe8"/><rect x="1" y="11.5" width="9" height="9" rx="2.5" fill="#3bc14f"/>
    <rect x="22" y="11.5" width="9" height="9" rx="2.5" fill="#e23a2e"/><rect x="11.5" y="22" width="9" height="9" rx="2.5" fill="#f2b705"/>
    <rect x="11.5" y="11.5" width="9" height="9" rx="2.5" fill="#1f2937"/>
    <path d="M16 13.6v4.8M13.6 16h4.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
    <div><b>Number Cross</b><span>Fill in the missing numbers.</span></div><i>&rarr;</i>
  </a>
  <a class="game" href="colorpop/index.html">
    <svg class="logo" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="1" y="1" width="9" height="9" rx="2.5" fill="#2f6fe8"/><rect x="11.5" y="1" width="9" height="9" rx="2.5" fill="#2f6fe8"/><rect x="22" y="1" width="9" height="9" rx="2.5" fill="#e23a2e"/>
    <rect x="1" y="11.5" width="9" height="9" rx="2.5" fill="#3bc14f"/><rect x="11.5" y="11.5" width="9" height="9" rx="2.5" fill="#f2b705"/><rect x="22" y="11.5" width="9" height="9" rx="2.5" fill="#e23a2e"/>
    <rect x="1" y="22" width="9" height="9" rx="2.5" fill="#3bc14f"/><rect x="11.5" y="22" width="9" height="9" rx="2.5" fill="#9b51e0"/><rect x="22" y="22" width="9" height="9" rx="2.5" fill="#9b51e0"/>
  </svg>
    <div><b>Color Pop</b><span>Pop every square off the board.</span></div><i>&rarr;</i>
  </a>
  <a class="game" href="blockfit/index.html">
    <svg class="logo" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="8" fill="#1f2937"/>
    <rect x="5" y="5" width="6.5" height="6.5" rx="1.5" fill="#3bc14f"/><rect x="12.75" y="5" width="6.5" height="6.5" rx="1.5" fill="#3bc14f"/>
    <rect x="20.5" y="5" width="6.5" height="6.5" rx="1.5" fill="#f2b705"/><rect x="20.5" y="12.75" width="6.5" height="6.5" rx="1.5" fill="#f2b705"/>
    <rect x="5" y="12.75" width="6.5" height="6.5" rx="1.5" fill="#3a3f4b"/><rect x="12.75" y="12.75" width="6.5" height="6.5" rx="1.5" fill="#3a3f4b"/>
    <rect x="5" y="20.5" width="6.5" height="6.5" rx="1.5" fill="#2f6fe8"/><rect x="12.75" y="20.5" width="6.5" height="6.5" rx="1.5" fill="#e23a2e"/><rect x="20.5" y="20.5" width="6.5" height="6.5" rx="1.5" fill="#e23a2e"/>
  </svg>
    <div><b>Block Fit</b><span>Fit shapes on the grid and clear lines.</span></div><i>&rarr;</i>
  </a>
  <a class="game" href="colorrides/index.html">
    <svg class="logo" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="8" fill="#1f2937"/>
    <rect x="4" y="5" width="15" height="7" rx="2.5" fill="#e23a2e"/><path d="M8 8.5h6.5m-2-2 2 2-2 2" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21" y="5" width="7" height="15" rx="2.5" fill="#f7dc1a"/><path d="M24.5 16V9.5m-2 2 2-2 2 2" stroke="#1b1b1f" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="4" y="14" width="15" height="7" rx="2.5" fill="#2f6fe8"/><path d="M15 17.5H8.5m2-2-2 2 2 2" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7" cy="26" r="2.4" fill="#e23a2e"/><circle cx="12.5" cy="26" r="2.4" fill="#2f6fe8"/><circle cx="18" cy="26" r="2.4" fill="#f7dc1a"/><circle cx="23.5" cy="26" r="2.4" fill="#3bc14f"/>
  </svg>
    <div><b>Color Rides</b><span>Drive the cars out and give everyone a ride.</span></div><i>&rarr;</i>
  </a>
</main>
</body>
</html>
